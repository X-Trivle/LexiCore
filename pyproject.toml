[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexicore"
version = "1.0.0"
description = "LexiCore-5000: an open, evidence-ranked English core vocabulary list (A1-C1) built from 13.6B words across five corpora."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
keywords = ["english", "vocabulary", "cefr", "wordlist", "frequency-list", "corpus-linguistics", "language-learning", "anki"]
authors = [{ name = "LexiCore maintainers" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/X-Trivle/LexiCore"
Repository = "https://github.com/X-Trivle/LexiCore"
Issues = "https://github.com/X-Trivle/LexiCore/issues"
Changelog = "https://github.com/X-Trivle/LexiCore/blob/main/CHANGELOG.md"

[project.scripts]
lexicore = "lexicore.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
