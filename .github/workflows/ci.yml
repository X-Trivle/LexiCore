name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: validate / test / lint (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Release contract
        run: |
          python -m lexicore validate
          python -m lexicore validate --json > validation.json
      - name: Integrity ledger
        run: python scripts/verify_checksums.py --data data
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Relative links in docs resolve
        run: python scripts/check_links.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-py${{ matrix.python }}
          path: validation.json
          if-no-files-found: ignore
